# release-assets — attach the three compiled `nen` binaries, and the SHA256SUMS
# that make them verifiable, to the release for a tag (zheref/nen#1).
#
# PORTED from bankai-core's .github/workflows/cli-release-assets.yml. The
# reasoning below is carried across because it is the deliverable: every rule
# here exists because of something that happened, and a pipeline that arrives
# without its reasons is a pipeline somebody "simplifies" into the incident.
#
# WHAT THIS DOES NOT DO: CREATE A RELEASE. The release go/no-go is the human's,
# and the tag/release distinction is load-bearing rather than cosmetic: a MARKER
# tag is a reference point that a consumer repin MUST NOT adopt, and it exists
# precisely so a tag can be cut without asserting that a release is complete. A
# workflow that turned every `v*` tag into a GitHub Release would silently
# promote every marker into the thing it is not — machinery authoring a release
# decision. So this attaches to a release that ALREADY exists, and says so
# loudly when there is none.
#
# That is why there are two triggers, not one. `push: tags` covers the ordinary
# order (the human publishes the release, then cuts/pushes the tag, or publishes
# from an existing tag), and `release: published` covers the reverse — a tag cut
# today and released next week — so the assets land whenever the human's half
# happens, without this file ever making that call itself. `workflow_dispatch` is
# the recovery lane: an upload that failed, or a release published before this
# workflow existed. All three converge on the same idempotent per-asset upload
# (`--clobber`, see the attach steps in `publish`), so a tag+release pair that
# fires both events attaches the same four byte-identical assets twice rather
# than half of them once.
#
# BUILD-ONCE-FROM-ONE-HOST: bun cross-compiles all three targets from the one
# macOS runner (package.json's `build:*` scripts hold the triples), so there is
# no build matrix and no per-OS build to keep in sync — and no way for two of
# the three binaries to come from a different commit than the third.
#
# TWO JOBS, ONE SET OF BYTES (zheref/nen#233). `build` on macOS compiles the
# three, ad-hoc-SIGNS the darwin one and EXECUTES it, writes SHA256SUMS from
# those bytes and hands the four files on as a workflow artifact; `publish` on
# Ubuntu takes that artifact, verifies the manifest again, EXECUTES the linux
# binary, and only then attaches the four to the release. Nothing is rebuilt
# on the second host: what the manifest describes is what was built once.
#
# WHY THE SIGNING STEP EXISTS. `bun build --compile` links an executable the
# linker ad-hoc-signs, then APPENDS the bundled payload after the link. The
# linker's signature covers the bytes as linked, so the append invalidates it
# (`codesign -v`: "code or signature have been modified"), and a macOS that
# enforces the signature SIGKILLs the process before main — exit 137, no
# output. Every published nen-darwin-arm64 from v0.9.0 to v0.12.0 shipped
# that way, and bootstrap/nen.sh could not catch it: the CHECKSUM was right,
# because the bytes were exactly the broken bytes SHA256SUMS described. A
# checksum proves the bytes; it proves nothing about whether they run. So the
# darwin binary is re-signed whole (`codesign -s - --force`), verified
# (`codesign -v`), and RUN (`--version` must print package.json's version) —
# and the linux binary is run on the host that can — before a manifest is
# written or anything is attached. A binary that does not execute here is a
# red job, not a release.
name: release-assets

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag whose release should receive the four assets (e.g.
          v0.1.0). Required: this lane never guesses "the latest tag" — the
          binaries are pinned to a ref by definition.
        required: true
        type: string

# PERMISSIONS. The floor is `contents: read` (an artifact upload and download
# need nothing above it), and the single elevation is on the one job that
# needs it:
#   * `contents: write` — REQUIRED. A GitHub release asset lives under the
#     `contents` scope, so `gh release upload` cannot attach a file with
#     `contents: read`. This is the ONE thing above the floor and it is the
#     entire reason this workflow exists.
# Nothing else is granted and nothing else is needed: no `issues:`, no
# `pull-requests:`, no `actions:`. `gh release view`/`upload` are the only API
# calls made, both against `contents`.
permissions:
  contents: read

# Serialized per tag, NEVER cancelled. `cancel-in-progress: true` on an upload
# lane could kill a run midway through attaching the four assets and leave a
# release carrying two binaries and no SHA256SUMS — the exact "silently ships two
# of three" state this workflow's preflight exists to prevent, arrived at from
# the other direction. (ci.yml takes the opposite setting, correctly: a
# superseded check has nothing to leave half-finished.)
concurrency:
  group: release-assets-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # The hard binding prevents a fork copy from allocating a runner when tag,
    # release, or manual events fire there after Actions has been enabled.
    if: github.repository == 'zheref/nen'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    outputs:
      # package.json's version, read once at the tagged commit, so the linux
      # smoke on the other host compares against the same expectation without
      # a second checkout.
      version: ${{ steps.version.outputs.version }}
    env:
      # Resolved once, from whichever of the three triggers fired:
      #   push     -> github.ref_name is the tag (the trigger filters to v*)
      #   release  -> github.event.release.tag_name
      #   dispatch -> github.event.inputs.tag (required input)
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
      # No GH_TOKEN here: this job calls `gh` for nothing. The token lives on
      # `publish`, the one job that attaches anything.
      # PINNED, and load-bearing rather than hygiene. `bun build --compile`
      # embeds the bun RUNTIME in every artifact, so the bun version is an INPUT
      # to the bytes: "the same commit produces the same binary" is only true at
      # a fixed compiler. A floating installer would make a re-run of this
      # workflow on the same tag produce different assets the day bun ships a
      # release.
      #
      # MUST MATCH ci.yml's BUN_VERSION EXACTLY, and does. That workflow PROVES
      # the build on every pull request; this one SHIPS it. If the two pins
      # drift, the binary CI verified and the binary a consumer downloads are
      # compiled by different compilers and are not the same bytes — which
      # silently voids the one property this pipeline exists to provide, while
      # both workflows stay green. Bump them in the same pull request or not at
      # all.
      BUN_VERSION: '1.4.0'
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The expression is spelled out again rather than referencing env.TAG:
          # `with:` is evaluated before the job's `env:` is guaranteed visible in
          # every runner context, and a checkout that silently resolved to the
          # default branch would build the wrong commit and attach it to a tag's
          # release — a failure that produces a green run and wrong bytes.
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
          # Shallow is fine and deliberate: nothing here reads history.
          fetch-depth: 1
          persist-credentials: false

      # THE PINNED INSTALLER, NOT setup-bun, and this is the ONE place the two
      # workflows deliberately differ. ci.yml uses `oven-sh/setup-bun` because a
      # check lane is allowed a convenience; this lane produces the bytes a
      # consumer executes, and the fewer third-party actions stand between a
      # reviewed commit and those bytes, the smaller the set of things that must
      # be trusted to make a checksum mean anything. `bash -s "bun-v${VERSION}"`
      # is the installer's documented version-pinning form; without the argument
      # it fetches whatever is current, which is the reproducibility hole
      # BUN_VERSION exists to close.
      #
      # Shell is permitted HERE for the same reason bootstrap/nen.sh is permitted
      # at all: environment bootstrap that cannot depend on the toolchain it
      # installs.
      - name: Install bun (version-pinned)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          # Echoed so the log records which compiler produced the artifacts a
          # consumer is about to trust, next to the SHA256SUMS they verify with.
          "$HOME/.bun/bin/bun" --version

      # `--frozen-lockfile`. On a pull request a lockfile drift is a nuisance; on
      # a release it is a different dependency tree compiled into a published
      # binary under a tag that claims to be the reviewed source. Fail instead.
      - name: Install dependencies (frozen lockfile)
        shell: bash
        run: bun install --ignore-scripts --frozen-lockfile

      # The three `build:*` scripts are invoked BY NAME, each with a hard-coded
      # `--outfile` in package.json, rather than through a wrapper: a build whose
      # output NAME varies run to run breaks reproducibility (a compiled binary
      # embeds its own `--outfile` basename), so the names stay literal in one
      # place and are not derived here.
      #
      # `set -e` makes any one target's failure red the job BEFORE the manifest
      # is written, so SHA256SUMS can never describe a partial set. The
      # completeness check below re-asserts the same thing from the other side,
      # against the manifest rather than against the exit codes.
      - name: Cross-compile the three release binaries
        shell: bash
        run: |
          set -euo pipefail
          bun run build:linux-x64
          bun run build:darwin-arm64
          bun run build:windows-x64

      # SIGN AFTER THE BUNDLE, VERIFY, THEN EXECUTE (zheref/nen#233). The
      # `build:darwin-arm64` script already runs src/dev/sign.ts as its last
      # step, so a local build is signed too; the step is repeated here in the
      # tool's own words so the release log shows the signature this lane
      # ships, and so the lane does not depend on the script having run.
      # `codesign -s -` is an AD-HOC signature: no identity, no notarization,
      # nothing Gatekeeper trusts — the same shape v0.8.0 shipped and runs
      # with. It is what makes the binary EXECUTE; what makes it TRUSTED is the
      # checksum a consumer verifies through bootstrap/nen.sh.
      #
      # Then the binary is RUN. A signature that verifies and a process that
      # still dies would be a different bug, and `--version` is the one
      # question the bootstrap's own caller asks first; the answer has to be
      # package.json's version at the tagged commit, not merely non-empty.
      - name: Sign the darwin binary after the bundle, verify it, and execute it
        id: version
        shell: bash
        run: |
          set -euo pipefail
          codesign -s - --force dist/nen-darwin-arm64
          codesign -v dist/nen-darwin-arm64
          codesign -dv dist/nen-darwin-arm64 2>&1 | grep -E '^CodeDirectory' || true
          expected="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          printed="$(./dist/nen-darwin-arm64 --version)"
          echo "darwin binary says '${printed}', package.json says '${expected}'"
          [ "${printed}" = "${expected}" ]
          echo "version=${expected}" >> "$GITHUB_OUTPUT"

      # The manifest is what a consumer verifies against (bootstrap/nen.sh), so
      # it is generated HERE, from the bytes actually about to be uploaded —
      # AFTER the signing step, because signing rewrites the file — rather than
      # carried in the repository.
      #
      # `shasum -a 256` over an explicit, sorted, literal file list: NOT a glob. A
      # glob would silently produce a shorter manifest if a target were missing,
      # which is the exact "silently ships two of three" failure the next step
      # exists to catch — and a manifest derived from whatever happens to be on
      # disk cannot catch it, because it would agree with itself. Filenames
      # ascending, matching the completeness check below.
      #
      # `bun build --compile` also drops an `index.js.map` beside each outfile;
      # naming the three binaries explicitly keeps that side artifact out of the
      # manifest and out of the release.
      - name: Write dist/SHA256SUMS from the bytes about to be uploaded
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          shasum -a 256 \
            'nen-darwin-arm64' \
            'nen-linux-x64' \
            'nen-windows-x64.exe' \
            > SHA256SUMS
          cat SHA256SUMS

      # FAIL LOUDLY BEFORE ANY UPLOAD. A release that silently ships two of three
      # binaries is worse than one that fails: the missing target's users get a
      # 404 at bootstrap time while everyone else sees a healthy release, so the
      # gap is discovered by whoever is unlucky rather than by CI. Two commands,
      # each of which IS the verdict — no `if`, nothing to get subtly wrong, and
      # `set -e` turns either one's non-zero exit into a red job.
      #
      # (1) INTEGRITY + PRESENCE. `shasum -a 256 -c` fails if SHA256SUMS is
      #     absent or empty, or if
      #     any file it names is missing, truncated or corrupt. One command
      #     covers the whole "are the bytes on disk the bytes the manifest
      #     claims" question, and it is the same check a consumer performs
      #     through bootstrap/nen.sh — so a release that passes here cannot fail
      #     there for a reason this workflow could have caught.
      #
      # (2) COMPLETENESS. `shasum -a 256 -c` is satisfied by a manifest listing ONE
      #     file, so integrity alone cannot detect a short set. The expected
      #     three names are therefore RESTATED here as literals rather than
      #     derived from package.json's `build:*` scripts: a check that reads its
      #     expectations from the table it is checking is a tautology and would
      #     pass unchanged if a target were deleted from that table. This is the
      #     third independent copy of the published filename contract — the other
      #     two are package.json (which produces them) and bootstrap/nen.sh
      #     (which consumes them) — and the `diff -u` output names precisely which
      #     one drifted.
      - name: Verify the release set is COMPLETE and intact
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          shasum -a 256 -c SHA256SUMS
          diff -u \
            <(printf '%s\n' 'nen-darwin-arm64' 'nen-linux-x64' 'nen-windows-x64.exe') \
            <(awk '{ sub(/^\*/, "", $2); print $2 }' SHA256SUMS)

      # The four files, by name and nothing else (no glob: the `index.js.map`
      # bun drops beside each outfile stays out), handed to the publish job.
      # An artifact is the ONE way the bytes built here reach the host that can
      # execute the linux binary without rebuilding them there. Pinned by SHA
      # like every other action in this repository.
      - name: Hand the four release files to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nen-release-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/nen-darwin-arm64
            dist/nen-linux-x64
            dist/nen-windows-x64.exe
            dist/SHA256SUMS

      # The manifest, in the run summary, on every run — attached or not. This is
      # what makes "the same commit produces the same binary" auditable after the
      # fact rather than merely asserted: the sums are readable from the run that
      # produced them, independently of the release they were (or were not)
      # attached to.
      #
      # NOT `working-directory: dist`: this step runs on a FAILED job too, and
      # `dist/` only exists once the build has succeeded. A step whose working
      # directory is missing fails with "directory does not exist" — a second,
      # meaningless error stacked on top of the real one, in the step whose job
      # is to explain what happened.
      - name: Record SHA256SUMS in the run summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### nen release assets — ${TAG} (built)"
            echo
            echo '```'
            cat dist/SHA256SUMS 2>/dev/null || echo '(no SHA256SUMS — the build did not reach the manifest step)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    # Same hard binding as `build`; `needs` makes a red build — a binary that
    # did not sign, verify or execute — a publish that never starts.
    if: github.repository == 'zheref/nen'
    needs: build
    # Ubuntu, on purpose: it is the one host in this repository's pools that can
    # EXECUTE the linux binary, and `gh` is preinstalled on it. It builds
    # nothing — the bytes come from `build`, and the manifest is re-checked
    # against them before the smoke and before the upload.
    runs-on: ubuntu-latest
    # RED, NEVER CANCELLED (zheref/nen#228). Every step below carries its own
    # `timeout-minutes`, and their SUM stays under this budget
    # (src/pipeline.test.ts asserts it). So whatever stalls, a STEP times out
    # first, fails by name, and the verdict step still runs and names what is
    # missing — the job killer is never the one that ends a run. v0.11.0 and
    # v0.12.0 were cancelled at the job budget with nothing but "cancelled" to
    # say which of four files had stalled.
    timeout-minutes: 60
    permissions:
      # The one elevation. See the block above the `permissions:` floor.
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
      # The four release assets IN ATTACH ORDER — the three binaries, then the
      # manifest that describes them — read by the verdict step to name what
      # is missing and to print the by-hand line in the order it must run.
      RELEASE_ASSETS: nen-darwin-arm64 nen-linux-x64 nen-windows-x64.exe SHA256SUMS
      # The retry bound, declared once. Each attempt's `gh release upload` is
      # killed at ATTACH_ATTEMPT_SECONDS (v0.10.0 attached all four in 6s, so
      # 120s is twenty times the healthy case, not a throughput claim), each
      # read-back at 20s, and the backoff is 15s × the attempt number. Worst
      # case per asset: 3 × (20 + 130 + 20) + 15 + 30 = 555s, inside the
      # 10-minute step bound below — so the helper, not the step killer, is
      # what normally reports an exhausted asset.
      ATTACH_ATTEMPTS: '3'
      ATTACH_ATTEMPT_SECONDS: '120'
      # ONE ASSET, BOUNDED AND RETRIED — the body every attach step runs, with
      # the asset name as $1, defined once here so the four steps cannot drift
      # into four different retry policies. An attempt counts only when the
      # upload exits 0 AND the release reads back that name, state `uploaded`,
      # at the byte size on disk; each attempt first logs what the release
      # already carries, so a log shows how far a stalled run got.
      ATTACH_ONE: |
        set -uo pipefail
        asset="$1"
        want="${asset} $(stat -c %s "${asset}")"
        readback() {
          timeout 20 gh release view "${TAG}" --repo "${REPO}" --json assets \
            --jq '.assets[] | select(.state == "uploaded") | "\(.name) \(.size)"'
        }
        for attempt in $(seq 1 "${ATTACH_ATTEMPTS}"); do
          echo "::group::${asset} — attempt ${attempt} of ${ATTACH_ATTEMPTS} (upload bounded at ${ATTACH_ATTEMPT_SECONDS}s)"
          echo "Already attached to ${TAG} before this attempt (name size):"
          readback | sed 's/^/  /' || echo "  (read-back failed; attempting the upload anyway)"
          timeout --kill-after=10 "${ATTACH_ATTEMPT_SECONDS}" \
            gh release upload "${TAG}" "${asset}" --repo "${REPO}" --clobber
          code=$?
          if [ "${code}" -eq 0 ] && readback | grep -qxF "${want}"; then
            echo "attempt ${attempt}: ${asset} attached and read back as '${want}'."
            echo "::endgroup::"
            exit 0
          elif [ "${code}" -eq 0 ]; then
            echo "attempt ${attempt}: upload exited 0 but the release does not read back '${want}'."
          elif [ "${code}" -eq 124 ] || [ "${code}" -eq 137 ]; then
            echo "attempt ${attempt}: upload TIMED OUT after ${ATTACH_ATTEMPT_SECONDS}s."
          else
            echo "attempt ${attempt}: upload exited ${code}."
          fi
          echo "::endgroup::"
          if [ "${attempt}" -lt "${ATTACH_ATTEMPTS}" ]; then
            sleep "$((attempt * 15))"
          fi
        done
        echo "::error title=${asset} not attached to ${TAG}::${ATTACH_ATTEMPTS} attempts, each bounded at ${ATTACH_ATTEMPT_SECONDS}s, did not attach ${asset}. The verdict step names every missing asset and the by-hand upload line."
        exit 1
    steps:
      # No checkout: nothing here reads the repository. The four files are the
      # artifact, and the expected version is `build`'s output.
      - name: Receive the four release files from the build job
        timeout-minutes: 5
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nen-release-${{ github.run_id }}
          path: dist

      # The same two checks `build` made, on the other side of the artifact
      # boundary: the bytes that arrived are the bytes the manifest describes,
      # and the set is complete. `sha256sum` here, `shasum` there — the
      # manifest format is the same, and bootstrap/nen.sh accepts either.
      - name: Verify the received set is intact and COMPLETE
        timeout-minutes: 2
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          sha256sum -c SHA256SUMS
          diff -u \
            <(printf '%s\n' 'nen-darwin-arm64' 'nen-linux-x64' 'nen-windows-x64.exe') \
            <(awk '{ sub(/^\*/, "", $2); print $2 }' SHA256SUMS)

      # EXECUTE THE LINUX BINARY (zheref/nen#233): the same question the darwin
      # one answered on the macOS runner, on the host that can ask it. The
      # artifact round-trip drops the execute bit, so it is restored first;
      # `chmod` changes no bytes, and the manifest above already agreed.
      - name: The linux binary answers --version
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/nen-linux-x64
          printed="$(./dist/nen-linux-x64 --version)"
          echo "linux binary says '${printed}', package.json said '${EXPECTED_VERSION}'"
          [ -n "${EXPECTED_VERSION}" ]
          [ "${printed}" = "${EXPECTED_VERSION}" ]

      # Does the human's half exist yet? THREE answers, not two, and only one of
      # them is green without attaching. `exists=true`: a release is there, and
      # the attach steps run. `exists=false`: gh said `release not found` — a
      # marker tag legitimately has no release, and a lane that went red on
      # every marker would train everyone to ignore it, so the job stays green
      # and the warning step below says so out loud. ANYTHING ELSE — a timeout,
      # a 5xx, an auth failure — is NOT "no release": it is a probe that could
      # not answer, and it fails this step red with gh's own words rather than
      # letting a slow API pass for a marker tag and skip the upload silently.
      - name: Is there a release for this tag yet?
        id: release_probe
        timeout-minutes: 2
        shell: bash
        run: |
          set -uo pipefail
          if out="$(timeout 60 gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease 2>&1)"; then
            echo "${out}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "${out}" = "release not found" ]; then
            echo "gh: ${out}"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Could not tell whether ${TAG} has a release::gh release view failed or timed out, and that is not 'release not found'. Nothing was attached. Re-run via workflow_dispatch with tag=${TAG}. gh said: ${out}"
            exit 1
          fi

      # ONE STEP PER ASSET, BINARIES FIRST, THE MANIFEST LAST (zheref/nen#228).
      #
      # WHY NOT ONE INVOCATION ANY MORE. The four files used to go up in ONE
      # `gh release upload` so the manifest and the binaries "arrived
      # together". They never did: gh attaches them one after another inside
      # that invocation, so the atomicity was never real — and the one
      # invocation had no bound, no retry and no per-file progress. v0.11.0 and
      # v0.12.0 stalled in it to the job budget and were cancelled with
      # SHA256SUMS attached and no binaries: a release that advertised checksums
      # for files that were not there, the exact state the old comment said the
      # shape prevented.
      #
      # WHAT REPLACES IT. Each asset is its own step, so the run list names
      # WHICH asset stalled; each step has its own `timeout-minutes`, well under
      # the job budget, and runs ATTACH_ONE's bounded, logged retries. The three
      # binaries run whatever happened to the one before them (`!cancelled()`),
      # so one bad file does not hide the state of the other two. SHA256SUMS
      # goes LAST and ONLY when all three binaries attached, so a partial
      # release carries binaries and no manifest — which bootstrap/nen.sh
      # refuses closed (exit 6) — and never a manifest naming absent files.
      #
      # IDEMPOTENT AND RE-RUNNABLE, by `--clobber`: re-running over a partial or
      # a complete release — the tag+release double fire, or a
      # `workflow_dispatch` recovery — replaces each asset with the same bytes
      # (build is pinned, see BUN_VERSION) instead of erroring on "already
      # exists". gh replaces an existing asset by deleting it and uploading
      # again, so on a re-run over a COMPLETE release one binary is briefly
      # absent while the manifest still names it; a consumer in that window gets
      # the bootstrap's retryable download failure (exit 4), not a wrong byte,
      # and a failure there ends this job red naming that asset.
      - name: Attach nen-darwin-arm64 (bounded, retried)
        id: attach_darwin
        if: ${{ !cancelled() && steps.release_probe.outputs.exists == 'true' }}
        timeout-minutes: 10
        shell: bash
        working-directory: dist
        run: bash -c "$ATTACH_ONE" attach-one 'nen-darwin-arm64'

      - name: Attach nen-linux-x64 (bounded, retried)
        id: attach_linux
        if: ${{ !cancelled() && steps.release_probe.outputs.exists == 'true' }}
        timeout-minutes: 10
        shell: bash
        working-directory: dist
        run: bash -c "$ATTACH_ONE" attach-one 'nen-linux-x64'

      - name: Attach nen-windows-x64.exe (bounded, retried)
        id: attach_windows
        if: ${{ !cancelled() && steps.release_probe.outputs.exists == 'true' }}
        timeout-minutes: 10
        shell: bash
        working-directory: dist
        run: bash -c "$ATTACH_ONE" attach-one 'nen-windows-x64.exe'

      - name: Attach SHA256SUMS LAST, only after all three binaries
        id: attach_manifest
        if: ${{ !cancelled() && steps.release_probe.outputs.exists == 'true' && steps.attach_darwin.outcome == 'success' && steps.attach_linux.outcome == 'success' && steps.attach_windows.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        working-directory: dist
        run: bash -c "$ATTACH_ONE" attach-one 'SHA256SUMS'

      # THE VERDICT, read back from the release rather than inferred from the
      # step outcomes: every asset in RELEASE_ASSETS must be attached, state
      # `uploaded`, at the byte size in dist/. Anything else ends the job RED
      # with the missing names in an `::error` annotation and in the run
      # summary, plus the by-hand line — binaries before SHA256SUMS, the same
      # order as the steps above — to run from this run's artifact.
      - name: Every asset is attached, or the job is red naming the missing ones
        if: ${{ !cancelled() && steps.release_probe.outputs.exists == 'true' }}
        timeout-minutes: 2
        shell: bash
        working-directory: dist
        run: |
          set -uo pipefail
          if ! listing="$(timeout 20 gh release view "$TAG" --repo "$REPO" --json assets \
                --jq '.assets[] | select(.state == "uploaded") | "\(.name) \(.size)"')"; then
            echo "::error title=Could not read ${TAG}'s assets back::gh release view failed or timed out, so this run cannot say what is attached. Re-run via workflow_dispatch with tag=${TAG}."
            exit 1
          fi
          missing=()
          {
            echo "### Attach verdict — ${TAG}"
            echo
            echo '| Asset | Expected bytes | Attached |'
            echo '|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          for asset in $RELEASE_ASSETS; do
            want="${asset} $(stat -c %s "${asset}")"
            if grep -qxF "${want}" <<<"${listing}"; then
              state='yes'
            else
              state='**MISSING**'
              missing+=("${asset}")
            fi
            echo "| \`${asset}\` | ${want#* } | ${state} |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            # Shell-quoted (`%q`), because this is offered as the exact line to
            # paste: a git tag may legally carry `$`, `;`, `&` or quotes.
            printf -v line '%q ' gh release upload "${TAG}" "${missing[@]}" --repo "${REPO}" --clobber
            line="${line% }"
            {
              echo
              echo "**Missing: ${missing[*]}.** From this run's \`nen-release-${GITHUB_RUN_ID}\` artifact, by hand (binaries before \`SHA256SUMS\`):"
              echo
              echo '```'
              echo "${line}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing release assets for ${TAG}::${missing[*]} not attached. Re-run via workflow_dispatch with tag=${TAG}, or by hand from this run's artifact: ${line}"
            exit 1
          fi
          echo "All four assets attached to ${REPO} release ${TAG} and read back at the expected sizes."

      # The other world, and it is a WARNING rather than an error on purpose —
      # see the probe step. It is not SILENCE, though: an absent release and a
      # successful upload must not look the same in the run list.
      - name: No release for this tag — nothing attached
        if: steps.release_probe.outputs.exists == 'false'
        timeout-minutes: 1
        shell: bash
        run: |
          echo "::warning title=No release for ${TAG}::The binaries built and verified, but ${REPO} has no release for tag ${TAG}, so nothing was attached. This workflow never CREATES one: the release go/no-go is the human's, and a marker tag is a deliberate non-release. Publish the release and this workflow re-runs on 'release: published' — or re-run it by hand via workflow_dispatch with tag=${TAG}."

      # The manifest again, from the publish side, on every run of THIS job —
      # attached or not — so the summary of a run says both what was built and
      # whether there was a release to attach to; the verdict above says what
      # actually landed. `build`'s copy is the one that exists when this job
      # never started.
      - name: Record SHA256SUMS in the run summary
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### nen release assets — ${TAG} (${{ steps.release_probe.outputs.exists == 'true' && 'release found; see the attach verdict' || steps.release_probe.outputs.exists == 'false' && 'no release, nothing attached' || 'release not probed or probe failed, nothing attached' }})"
            echo
            echo '```'
            cat dist/SHA256SUMS 2>/dev/null || echo '(no SHA256SUMS — the artifact did not arrive)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
