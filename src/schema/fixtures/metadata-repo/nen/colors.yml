# TEST FIXTURE (zheref/nen#338) -- the $-metadata guarantee for nen/colors.yml.
# Derived from bankai-repo/nen/colors.yml with a $-prefixed key at every level:
# the root, `categories`, each category, each `values` map and value entries.
# declarations.test.ts loads it beside a copy with every $ key stripped and
# requires the same vocabulary. Not shipped; see ../../README.md.


version: 1
$comment: a root-level annotation, read by no loader

categories:
  $categories: a $ key inside the map of categories is not a category

  status:
    $scope: metadata named after 'scope'
    scope: >-
      One per issue or PR, describing where it sits in the human-gate lifecycle.
      Rendered in a column headed "Status".
    precedence: [on_hold, blocked, ready_g2_g4, ready_g1, in_progress]
    values:
      $note: a $ key inside a values map is not a value
      on_hold:
        $emoji: metadata named after 'emoji', never an extra field
        emoji: "🔵"
        hex: "#0052cc"
        label: Intentionally on hold
        means: >-
          Deliberately parked pending another effort's resolution.
        gate: null
      blocked:
        emoji: "🔴"
        hex: "#d73a4a"
        label: Blocked
        means: >-
          A human-only action is required before anything can move.
        gate: G5
      ready_g2_g4:
        emoji: "🟢"
        hex: "#0e8a16"
        label: G2/G4-ready
        means: The readiness gate reports the PR ready and mergeable.
        gate: G2/G4
        decided_by: scripts/pr_ready_gate.sh
      ready_g1:
        emoji: "🟡"
        hex: "#fbca04"
        label: G1-ready
        means: Ready to be started, or to have its spec iterated.
        gate: G1
      in_progress:
        emoji: "🟠"
        # Deliberately NOT the severity/high hex -- two categories sharing a
        # glyph is fine while sharing a swatch is a trap.
        hex: "#ef6c00"
        label: In progress
        means: Work is moving.
        gate: null

  severity:
    $scope: metadata named after 'scope'
    scope: A finding's or issue's severity.
    label_source: nen/labels.json
    values:
      $note: a $ key inside a values map is not a value
      critical:
        $emoji: metadata named after 'emoji', never an extra field
        emoji: "🛑"
        hex: "#b60205"
        label: bankai:severity/critical
        means: Blocks and pages the human immediately, overriding normal cadence.
      high:
        emoji: "🔴"
        hex: "#d93f0b"
        label: bankai:severity/high
        means: Must fix before merge/release.
      medium:
        emoji: "🟡"
        hex: "#fbca04"
        label: bankai:severity/medium
        means: Fix soon.
      low:
        emoji: "🟢"
        hex: "#0e8a16"
        label: bankai:severity/low
        means: Nice to fix.

  agent_identity:
    $scope: metadata named after 'scope'
    scope: Output header only -- the agent's own character badge.
    values:
      $note: a $ key inside a values map is not a value
      ichigo:   { emoji: "🟥", note: "Red SQUARE, deliberately -- must not collide with the circles." }
      naruto:   { emoji: "🟠", note: "Spec-plane sibling; shares the glyph by design." }
      sasuke:   { emoji: null }
      tenma:    { emoji: null }
