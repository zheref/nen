# runner-preflight -- proves the self-hosted @@POOL_ID@@ pool can RUN a job,
# not merely that it is registered. Rendered by @@RENDERED_BY@@ for
# @@REPO_SLUG@@; re-render it rather than editing it.
#
# WHY IT EXISTS. A runner GitHub shows as Idle proves the runner PROCESS works.
# It says nothing about whether the HOST carries the tools a job invokes, or
# whether the SERVICE ACCOUNT may execute them. A runner service resolves
# commands on the MACHINE PATH, as a plain local account with no interactive
# profile: every tool must be machine-LOCATED (on that PATH) and
# machine-READABLE (an ACE that lets the account execute the file the PATH
# entry resolves to). Nothing observable from the maintainer's own shell tells
# the two apart; only a job running as the service does. This is that job.
# Run it green BEFORE the pool's enable variable is set -- enabling first
# leaves every gated job queued on a pool that cannot run it.
#
#   nen runner preflight --target @@REPO_SLUG@@ --workflow @@WORKFLOW_FILE@@
#
# FORK SAFETY. This job runs arbitrary steps on a physical machine, so the
# trigger set is the control. `push` fires only in the repository the push
# landed in and `workflow_dispatch` needs write access; `pull_request` is
# deliberately absent, because its workflow definition -- `if:` included --
# comes from the PR head, which a fork controls. The job-level `if:` binds the
# canonical repository so a fork that enables Actions on its copy skips before
# a runner is ever assigned.
#
# `push` is path-filtered to this file: it costs nothing on any other change
# and still proves itself on the branch that changes it.
name: runner-preflight-@@POOL_ID@@

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/@@WORKFLOW_FILE@@'

permissions:
  contents: read

concurrency:
  group: runner-preflight-@@POOL_ID@@-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: github.repository == '@@REPO_SLUG@@'
    # Exactly the pool's labels. A job queues until a runner carrying all of
    # them is free; it never falls back to another pool.
    runs-on: @@RUNS_ON@@
    # Bounds the RUN, not the wait: a job queues indefinitely when every slot
    # is busy or offline, and a preflight that never starts is itself the
    # answer ('nen runner preflight' names it).
    timeout-minutes: 5
    steps:
      # Checkout shells out to git, so a host without a working git fails
      # here -- already a finding. A consumer whose policy requires SHA pins
      # re-pins this line in the pull request that adds the file.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm this landed on the @@OS@@ pool
        shell: bash
        env:
          EXPECTED_OS: '@@OS@@'
        run: |
          echo "runner name : ${RUNNER_NAME:-<unset>}"
          echo "runner os   : ${RUNNER_OS:-<unset>}"
          echo "service acct: ${USERNAME:-${USER:-${LOGNAME:-unknown}}}"
          if [ "${RUNNER_OS:-}" != "$EXPECTED_OS" ]; then
            echo "::error::Preflight landed on '${RUNNER_OS:-<unset>}', not $EXPECTED_OS -- it proves nothing about the @@POOL_ID@@ pool. Check runs-on and that a runner of this pool was free."
            exit 1
          fi

      # 126 is not 127. 127 = not on the service's PATH (a LOCATION problem);
      # 126 = found, and refused on exec (a PERMISSION problem -- the ACL on the
      # file the PATH entry resolves to). Every PATH-shaped check passes during
      # a 126, so the two are named apart. Bash built-ins only: this step
      # diagnoses a broken toolchain and must not depend on one.
      - name: Host toolchain -- every tool a job on this pool invokes
        shell: bash
        env:
          TOOLS: '@@TOOLS@@'
          MODE: '@@MODE@@'
        run: |
          set -uo pipefail
          acct="${USERNAME:-${USER:-${LOGNAME:-unknown}}}"
          # An interactive Windows runner is a logon task, not a service: it
          # picks up a changed PATH or ACL when its account signs in again.
          restart="restart the runner services"
          if [ "$MODE" = interactive ] && [ "${RUNNER_OS:-}" = Windows ]; then
            restart="sign the runner's account ($acct) out and back in, which restarts its logon task"
          fi
          status=0
          for tool in $TOOLS; do
            rc=0
            "$tool" --version || rc=$?
            case "$rc" in
              0) ;;
              126) echo "::error::'$tool' resolves on the PATH but the runner account ($acct) cannot EXECUTE it (exit 126). An ACL problem, not a PATH problem: grant Users read-and-execute on the file it resolves to, then $restart."; status=$rc ;;
              127) echo "::error::'$tool' is not on the runner's PATH (exit 127). Install it machine-wide, put its directory on the MACHINE PATH, then $restart."; status=$rc ;;
              *) echo "::error::'$tool --version' exited $rc -- found and executed, so neither a PATH (127) nor an ACL (126) problem. Read the output above."; status=$rc ;;
            esac
            if [ "$status" -ne 0 ]; then exit "$status"; fi
          done

      # A Windows service runs with the MACHINE environment. A tool installed for
      # the maintainer's user resolves in their shell and is invisible here, so
      # an AppData hit fails the run. An interactive pool's logon task runs with
      # its own account's environment, so there a hit is a WARNING: it works for
      # this account and would not survive a change of account.
      - name: Resolution must be machine-wide (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          TOOLS: '@@TOOLS@@'
          MODE: '@@MODE@@'
        run: |
          set -uo pipefail
          resolved="$(where.exe $TOOLS || true)"
          resolved="${resolved//$'\r'/}"
          printf '%s\n' "$resolved"
          bad=0
          shopt -s nocasematch
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            norm="${line//\\//}"
            if [[ "$norm" == */appdata/* ]]; then
              if [ "$MODE" = interactive ]; then
                echo "::warning::'$line' resolves under AppData -- a per-user install. It works for this runner's account and would not survive another one; prefer a machine-wide install."
              else
                echo "::error::'$line' resolves under AppData -- a per-user install the runner service cannot rely on. Reinstall it machine-wide and restart the runner services."
                bad=1
              fi
            fi
          done <<< "$resolved"
          exit "$bad"

      # An interactive pool (mode @@MODE@@) exists for jobs that drive a real UI,
      # and only a signed-in desktop session can run them. A runner installed as
      # a service runs in session 0, which has no desktop, and a UI job there
      # times out. Rendered for every pool; it runs only for an interactive
      # Windows one.
      - name: Desktop session present (interactive Windows pool)
        if: runner.os == 'Windows' && '@@MODE@@' == 'interactive'
        shell: bash
        run: |
          set -uo pipefail
          session="$(powershell.exe -NoProfile -NonInteractive -Command '[System.Diagnostics.Process]::GetCurrentProcess().SessionId' | tr -d '\r')"
          echo "session id  : ${session:-<unknown>}"
          echo "session name: ${SESSIONNAME:-<unset>}"
          if [ -z "$session" ] || [ "$session" = "0" ]; then
            echo "::error::This job runs in session ${session:-<unknown>}, not in a signed-in desktop session. A runner installed as a service (session 0) cannot drive a UI. Register the pool's runners from an interactive plan ('nen runner script' renders a logon task), and sign its account in to the desktop."
            exit 1
          fi

      # A launchd agent (macOS) or a systemd service (Linux) can see a tool in a
      # user-scope directory, so a hit there is a WARNING, not a failure: it
      # works for this account and would not survive a change of service user.
      - name: Resolution outside the home directory (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TOOLS: '@@TOOLS@@'
        run: |
          set -uo pipefail
          for tool in $TOOLS; do
            path="$(command -v "$tool" || true)"
            echo "$tool -> ${path:-<not found>}"
            case "$path" in
              "$HOME"/.local/*|"$HOME"/bin/*) echo "::warning::'$tool' resolves to $path, a user-scope directory. It works for this service user and would not survive another one." ;;
            esac
          done
